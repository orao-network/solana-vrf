[package]
name = "orao-solana-vrf"
version = "0.7.0"
edition = "2021"
authors = ["ORAO Devs <hello@orao.network>"]
homepage = "https://orao.network"
repository = "https://github.com/orao-network/solana-vrf"
license = "Apache-2.0"
keywords = ["solana", "vrf", "randomizer", "gamblefi", "anchor"]
description = "ORAO Verifiable Random Function for Solana."

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]
sdk = [
    "anchor-client",
    "ed25519-dalek",
    "no-entrypoint",
    "solana-rpc-client",
    "solana-rpc-client-api",
    "thiserror",
    "tokio",
]
default = ["sdk"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
anchor-client = { workspace = true, optional = true, features = ["async"] }
solana-rpc-client = { workspace = true, optional = true }
solana-rpc-client-api = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
tokio = { version = "1", optional = true }
thiserror = { version = "1", optional = true }
bs58.workspace = true

[dev-dependencies]
byteorder = "1.5"
solana-cli-config.workspace = true
rand.workspace = true
anchor-client = { workspace = true, features = ["debug"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
