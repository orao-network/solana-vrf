[package]
name = "roulette-cli"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anchor-client = { version = "1.2.1", default-features = false, features = ["async", "solana-v4"] }
anyhow = "1"
env_logger = "0.9"
indicatif = "0.17"
orao-solana-vrf = { path = "../../../../sdk" }
russian-roulette = { path = "../../programs/russian-roulette", features = [
    "sdk",
] }
solana-sdk = "4"
solana-commitment-config = "3"
# Agave 4.4 client crates moved to solana-transaction 5, which anchor-client 1.2
# still cannot use; stay on the 4.3 line until Anchor catches up.
solana-rpc-client = "~4.3"
solana-rpc-client-api = "~4.3"
solana-cli-config = "4"
structopt = "0.3"
tokio = { version = "1", features = ["macros"] }
