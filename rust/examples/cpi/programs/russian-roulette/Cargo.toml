[package]
name = "russian-roulette"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "russian_roulette"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]
sdk = ["no-entrypoint", "rand", "anchor-client", "solana-sdk"]
default = []

[dependencies]
anchor-client = { version = "1.2.1", optional = true, default-features = false, features = ["async", "solana-v4"] }
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4", "init-if-needed"] }
blake3 = "=1.8.2"
orao-solana-vrf = { path = "../../../../sdk", default-features = false, features = [
    "cpi",
    "solana-v4",
] }
rand = { version = "0.8", optional = true }
solana-sdk = { version = "4", optional = true }
